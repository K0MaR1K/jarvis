name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# чтобы публиковать APK в Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle с кэшем
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Публикация в Releases: APK качается прямой ссылкой без входа
      - name: Опубликовать APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Сборка #$GITHUB_RUN_NUMBER" --notes "Автосборка Джарвиса" \
            || gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
